[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-alignment"
version = "0.1.0"
description = "Evidence-preserving requirement test alignment research"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ingest = ["zstandard>=0.21,<1"]

[project.scripts]
alignment = "alignment.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
